<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purwadhika BootCamp Exercises</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="glow-element top-left"></div>
    <div class="glow-element bottom-right"></div>

    <div class="container">
        <header>
            <h1>My Learning Journey</h1>
            <p>A dynamic index of all my modules and exercises</p>
        </header>

        <main id="modules-container">
            <!-- Loading indicator -->
            <div id="loader" class="loader">
                <div class="spinner"></div>
                <p>Fetching repository data from GitHub API...</p>
            </div>
            <!-- Modules will be dynamically injected here -->
        </main>

        <footer>
            <p>Built with Vanilla JS and the GitHub REST API</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
