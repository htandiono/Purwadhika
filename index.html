<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purwadhika Coursework</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="glow-element top-left"></div>
    <div class="glow-element bottom-right"></div>

    <div class="container">
        <header>
            <h1>Purwadhika Coursework</h1>
            <p>Projects and exercises completed during the program.</p>
        </header>

        <main>
            <section class="featured-projects" aria-labelledby="projects-title">
                <article class="module-card project-card">
                    <h2 class="module-title" id="projects-title">Selected Projects</h2>
                    <div class="exercise-list">
                        <a class="exercise-link project-link" href="./Projects/company-profile/">
                            <span>
                                <strong>Eventure</strong>
                                <small>Browse events or manage them from the same platform</small>
                            </span>
                        </a>
                        <a class="exercise-link project-link" href="./Projects/about-me/">
                            <span>
                                <strong>About Me</strong>
                                <small>Experience, technical focus, and selected project work</small>
                            </span>
                        </a>
                    </div>
                </article>
            </section>

            <section id="modules-container" aria-label="Learning modules">
                <div id="loader" class="loader">
                    <div class="spinner"></div>
                    <p>Preparing published modules...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Built with HTML, CSS, and vanilla JavaScript.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
